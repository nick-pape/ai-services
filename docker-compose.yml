# ==============================================================================
# AI Services Docker Compose Configuration
# ==============================================================================
# - PocketTTS (Text-to-Speech service)
# - Whisper.cpp (Speech-to-Text service)
# - Gemma4 E2B via llama.cpp (VLM, OpenAI-compatible API — replaces Ollama)
# - Open WebUI (Web interface)
#
# All services configured for NVIDIA GPU acceleration on ARM64 architecture
# ==============================================================================

services:
  # ==============================================================================
  # Kokoro FastAPI TTS Service (DISABLED - replaced by PocketTTS)
  # ==============================================================================
  # kokoro-fastapi:
  #   container_name: kokoro-fastapi
  #   image: dustynv/kokoro-tts:fastapi-r36.4.0-cu128-24.04
  #   restart: unless-stopped
  #   platform: linux/arm64/v8
  #   runtime: nvidia
  #   gpus: all
  #   environment:
  #     NVIDIA_REQUIRE_CUDA: "cuda>=12.6"
  #     CUDA_VERSION: "12.6.0"
  #     NVIDIA_VISIBLE_DEVICES: "all"
  #     NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   ports:
  #     - "${KOKORO_PORT:-8880}:8880"

  # ==============================================================================
  # PocketTTS OpenAI-Compatible TTS Service
  # ==============================================================================
  pocket-tts:
    container_name: pocket-tts
    build:
      context: ./pocket-tts
      dockerfile: Dockerfile
    restart: unless-stopped
    platform: linux/arm64/v8
    runtime: nvidia
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      POCKET_TTS_DEVICE: "cuda"
      HF_HOME: /data/cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 4G

    ports:
      - "${POCKET_TTS_PORT:-8890}:8880"

    volumes:
      - /data/cache/huggingface:/data/cache/huggingface
      - ./pocket-tts/voices:/app/voices

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ==============================================================================
  # Whisper.cpp Speech-to-Text Service
  # ==============================================================================
  whisper-cpp:
    container_name: whisper-cpp
    build:
      context: ./whisper-cpp
      dockerfile: Dockerfile
    restart: unless-stopped
    platform: linux/arm64/v8
    runtime: nvidia
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      LD_LIBRARY_PATH: /opt/cuda-tegra:/usr/local/cuda/lib64

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 4G

    ports:
      - "${WHISPER_PORT:-8000}:8000"

    volumes:
      - ./whisper-cpp/models:/models
      - ./whisper-cpp/cuda-libs:/opt/cuda-tegra:ro

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==============================================================================
  # Speaches Speech Processing Service (DISABLED - replaced by Whisper.cpp)
  # ==============================================================================
  # speaches:
  #   container_name: speaches
  #   image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
  #   ...

  # ==============================================================================
  # Ollama Language Model Server (DISABLED - replaced by Gemma4/llama.cpp)
  # ==============================================================================
  # Benchmarks on Orin Nano Super: Ollama qwen3-vl:4b = 8.7 tok/s vs llama.cpp = 29 tok/s
  # ollama:
  #   container_name: ollama
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   platform: linux/arm64/v8
  #   runtime: nvidia
  #   gpus: all
  #   stdin_open: true
  #   tty: true
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: "all"
  #     NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  #     OLLAMA_HOST: 0.0.0.0:11434
  #     OLLAMA_KEEP_ALIVE: 10m
  #     OLLAMA_READ_TIMEOUT: 300s
  #     OLLAMA_WRITE_TIMEOUT: 300s
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   volumes:
  #     - /data/cache/ollama:/root/.ollama
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"

  # ==============================================================================
  # Gemma4 E2B Vision-Language Model Server (replaces Ollama)
  # ==============================================================================
  # llama.cpp server — OpenAI-compatible API on port 8082
  # ~3.3x faster than Ollama+qwen3-vl:4b on Orin Nano Super (29 vs 8.7 tok/s)
  # Model files in /data/cache/huggingface/gemma4-E2B/
  gemma4:
    container_name: gemma4
    image: ghcr.io/nvidia-ai-iot/llama_cpp:latest-jetson-orin
    restart: unless-stopped
    platform: linux/arm64/v8
    runtime: nvidia
    gpus: all
    network_mode: host

    command: >
      llama-server
      -m /models/gemma-4-E2B-it-Q4_K_S.gguf
      --mmproj /models/mmproj-F16.gguf
      --port ${GEMMA4_PORT:-8082}
      --host 0.0.0.0
      --ctx-size 4096
      -n -1
      --alias gemma4
      --reasoning off
      --reasoning-budget 100

    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "1"
      CUDA_SCALE_LAUNCH_QUEUES: "4x"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - /data/cache/huggingface/gemma4-E2B:/models

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:${GEMMA4_PORT:-8082}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # ==============================================================================
  # Open WebUI
  # ==============================================================================
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    platform: linux/arm64/v8
    runtime: nvidia
    gpus: all
    network_mode: host

    environment:
      TTS_BACKEND_URL: http://127.0.0.1:${POCKET_TTS_PORT:-8890}
      OPENAI_API_BASE_URL: http://127.0.0.1:${GEMMA4_PORT:-8082}/v1
      OPENAI_API_KEY: "sk-no-key-required"

    volumes:
      - ./open-webui:/app/backend/data

    depends_on:
      - gemma4

  # ==============================================================================
  # Florence-2 Vision Model Service (persistent, ~500MB VRAM)
  # ==============================================================================
  # Microsoft Florence-2-base: open-vocab detection, dense region caption,
  # referring segmentation. Runs alongside Gemma4 in 8GB unified memory.
  # API: POST /predict {image: base64, task: "<DENSE_REGION_CAPTION>", text: ""}
  florence2:
    container_name: florence2
    build:
      context: ./florence2
      dockerfile: Dockerfile
    restart: unless-stopped
    platform: linux/arm64/v8
    runtime: nvidia
    gpus: all
    network_mode: host

    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HOME: /data/cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 2G

    volumes:
      - /data/cache/huggingface:/data/cache/huggingface

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
